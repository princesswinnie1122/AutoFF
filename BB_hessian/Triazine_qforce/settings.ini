
[ff]
n_equiv = 4
n_excl = 2
lennard_jones = opls_auto
ext_charges = no
charge_scaling = 1.2
use_ext_charges_for_frags = no
ext_lj_lib = 
ext_lj_fudge = 
ext_q_fudge = 
ext_comb_rule = 
ext_h_cap = 
all_rigid = no
res_name = MOL

[qm]
software = gaussian
scan_step_size = 10.0
charge = 0
multiplicity = 1
memory = 80000
n_proc = 1
vib_scaling = 0.957
dihedral_scanner = relaxed_scan

[qm::software(gaussian)]
charge_method = cm5
method = wb97xd
dispersion = False
basis = 6-311G(d,p)
solvent_method = 

[scan]
do_scan = no
avail_only = False
frag_threshold = 3
conj_bo_cutoff = 1.4
break_co_bond = no
method = gromacs
gromacs_exec = gmx_d
n_dihed_scans = 5
plot_fit = no
frag_lib = ~/qforce_fragments
batch_run = False

[terms]
urey = False
dihedral/rigid = True
dihedral/improper = True
dihedral/flexible = True
dihedral/inversion = True
non_bonded = True
